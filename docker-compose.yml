name: dosing-console

services:
  api:
    build: ./api
    image: dosing-console-api
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=3)"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  web:
    build: ./web
    image: dosing-console-web
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  # 一次性验收服务：跑完 pytest（API 网络验收 + Playwright 端到端）即退出
  verify:
    build: ./verify
    image: dosing-console-verify
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    environment:
      API_BASE_URL: http://api:8000
      WEB_BASE_URL: http://web
